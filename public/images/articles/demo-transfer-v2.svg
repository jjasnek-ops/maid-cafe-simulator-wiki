<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Continue a demo save</title><desc id="desc">The launch instruction in three steps. 01: Open the full game. Steam App 3232690. Use the full release. 02: Open the save screen. Find the labeled slot. No file-copy step is given. 03: Select [Demo]. Continue demo progress. Missing slot? Read support limits</desc><rect width="1200" height="675" rx="30" fill="#fff8ef"/><path d="M0 0h1200v12H0z" fill="#a82e60"/><g font-family="Arial, sans-serif" fill="#293a44"><text x="60" y="98" font-size="42" font-weight="800">Continue a demo save</text><text x="60" y="148" font-size="26" fill="#52616a">The launch instruction in three steps</text><g transform="translate(60,210)"><rect width="344" height="350" rx="24" fill="#f5e1e7"/><g transform="translate(28,27) scale(.65)" fill="none" stroke="#a82e60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 24h52v24c0 20-52 20-52 0z M70 28h10c19 0 19 25-10 25 M12 70h67 M29 5v10 M46 5v10 M63 5v10"/></g><text x="28" y="129" font-size="52" font-weight="800" fill="#a82e60">01</text><text x="28" y="193" font-size="27" font-weight="700">Open the full game</text><text x="28" y="238" font-size="21" fill="#52616a">Steam App 3232690</text><text x="28" y="276" font-size="21" fill="#52616a">Use the full release</text></g><g transform="translate(428,210)"><rect width="344" height="350" rx="24" fill="#e6efeb"/><g transform="translate(28,27) scale(.65)" fill="none" stroke="#226a67" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 23h30l10 11h39v45H9z M9 23V12h29l9 11h41v11 M28 53h42 M28 66h25"/></g><text x="28" y="129" font-size="52" font-weight="800" fill="#226a67">02</text><text x="28" y="193" font-size="27" font-weight="700">Open the save screen</text><text x="28" y="238" font-size="21" fill="#52616a">Find the labeled slot</text><text x="28" y="276" font-size="21" fill="#52616a">No file-copy step is given</text></g><g transform="translate(796,210)"><rect width="344" height="350" rx="24" fill="#f5e1e7"/><g transform="translate(28,27) scale(.65)" fill="none" stroke="#a82e60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 23h30l10 11h39v45H9z M9 23V12h29l9 11h41v11 M28 53h42 M28 66h25"/></g><text x="28" y="129" font-size="52" font-weight="800" fill="#a82e60">03</text><text x="28" y="193" font-size="27" font-weight="700">Select [Demo]</text><text x="28" y="238" font-size="21" fill="#52616a">Continue demo progress</text><text x="28" y="276" font-size="21" fill="#52616a">Missing slot? Read support limits</text></g><text x="60" y="614" font-size="20" fill="#52616a">Original flowchart • The cards are instructions, not a recreated save screen.</text></g></svg>
