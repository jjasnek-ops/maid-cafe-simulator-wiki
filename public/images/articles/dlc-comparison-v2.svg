a">One helper entry per maid</text><text x="28" y="276" font-size="26" fill="#52616a">Assignable cafe jobs</text></g><text x="60" y="614" font-size="20" fill="#52616a">Original catalog comparison • DLC is optional; confirm actual items on their Steam pages.</text></g></svg>
