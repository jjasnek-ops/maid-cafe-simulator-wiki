<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Make a useful issue report</title><desc id="desc">An editorial checklist for an unresolved symptom. CONTEXT: Record the objective. Full game or demo build. Current story task and save state. REPRODUCTION: Record what happens. Time and location checked. Steps and the observed result</desc><rect width="1200" height="675" rx="30" fill="#fff8ef"/><path d="M0 0h1200v12H0z" fill="#a82e60"/><g font-family="Arial, sans-serif" fill="#293a44"><text x="60" y="98" font-size="42" font-weight="800">Make a useful issue report</text><text x="60" y="148" font-size="26" fill="#52616a">An editorial checklist for an unresolved symptom</text><g transform="translate(60,210)"><rect width="528" height="350" rx="24" fill="#f5e1e7"/><g transform="translate(28,27) scale(.65)" fill="none" stroke="#a82e60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M30 17H14v68h72V17H69 M31 8h36v22H31z M30 48l5 5 9-11 M54 48h18 M30 68l5 5 9-11 M54 68h18"/></g><text x="28" y="129" font-size="21" font-weight="800" fill="#a82e60">CONTEXT</text><text x="28" y="180" font-size="34" font-weight="700">Record the objective</text><text x="28" y="238" font-size="26" fill="#52616a">Full game or demo build</text><text x="28" y="276" font-size="26" fill="#52616a">Current story task and save state</text></g><g transform="translate(612,210)"><rect width="528" height="350" rx="24" fill="#e6efeb"/><g transform="translate(28,27) scale(.65)" fill="none" stroke="#226a67" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M67 12c-57 5-61 79-3 75 20-1 30-12 34-24-55 22-77-22-31-51z"/></g><text x="28" y="129" font-size="21" font-weight="800" fill="#226a67">REPRODUCTION</text><text x="28" y="180" font-size="34" font-weight="700">Record what happens</text><text x="28" y="238" font-size="26" fill="#52616a">Time and location checked</text><text x="28" y="276" font-size="26" fill="#52616a">Steps and the observed result</text></g><text x="60" y="614" font-size="20" fill="#52616a">Original reporting guide • Do not delete progress on the basis of an unverified fix.</text></g></svg>
